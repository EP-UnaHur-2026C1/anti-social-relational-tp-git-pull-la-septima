openapi: 3.0.3
info:
  title: UnaHur Anti-Social Net API
  description: API REST para red social. TP de Estrategias de Persistencia.
  version: 1.0.0
  contact:
    name: git pull la septima
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Users
    description: Gestión de usuarios
  - name: Posts
    description: Publicaciones de los usuarios
  - name: Post Images
    description: Imágenes asociadas a un post
  - name: Comments
    description: Comentarios sobre posts
  - name: Tags
    description: Etiquetas para categorizar posts

paths:

  # ============================================================
  # USERS
  # ============================================================
  /users:
    get:
      tags: [Users]
      summary: Listar todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Crear un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            examples:
              ejemplo:
                value:
                  nickname: "cris"
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Actualizar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Usuario actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      responses:
        '200':
          description: Usuario eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # POSTS
  # ============================================================
  /posts:
    get:
      tags: [Posts]
      summary: Listar todos los posts con imágenes, comentarios y tags
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Posts]
      summary: Crear un post para el usuario (con imágenes opcionales)
      description: |
        Acepta `multipart/form-data` para poder subir imágenes en la misma request.
        `texto` es obligatorio. `tags` se manda como array de IDs.
        `images` admite hasta 10 archivos (jpg/png/webp, max 5 MB cada uno).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                  example: "Mi primer post!"
                tags:
                  type: array
                  description: IDs de tags a asociar
                  items:
                    type: integer
                  example: [1, 2]
                images:
                  type: array
                  description: Hasta 10 imágenes
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{id_post}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    delete:
      tags: [Posts]
      summary: Eliminar un post (borra imágenes en disco y filas relacionadas)
      responses:
        '200':
          description: Post eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/user/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Posts]
      summary: Listar todos los posts de un usuario
      responses:
        '200':
          description: Posts del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/user/{id}/post/{id_post}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      summary: Obtener un post específico de un usuario
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Posts]
      summary: Actualizar el texto de un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                  example: "Texto actualizado"
      responses:
        '200':
          description: Post actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # POST IMAGES
  # ============================================================
  /post_images/user/{id}/post/{id_post}/images:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Post Images]
      summary: Listar todas las imágenes de un post
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostImage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Post Images]
      summary: Subir una imagen y asociarla a un post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Imagen creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /post_images/user/{id}/post/{id_post}/images/{id_pi}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PostId'
      - $ref: '#/components/parameters/PostImageId'
    get:
      tags: [Post Images]
      summary: Obtener una imagen por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostImage'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Post Images]
      summary: Reemplazar el archivo de una imagen
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Imagen actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Post Images]
      summary: Eliminar una imagen (también borra archivo del disco)
      responses:
        '200':
          description: Imagen eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # COMMENTS
  # ============================================================
  /comments/user/{id_user}/post/{id_post}:
    parameters:
      - name: id_user
        in: path
        required: true
        description: ID del usuario que comenta
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Comments]
      summary: Crear un comentario en un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comentario]
              properties:
                comentario:
                  type: string
                  example: "Buen post!"
      responses:
        '201':
          description: Comentario creado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/post/{id_post}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Comments]
      summary: Listar comentarios visibles de un post
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/delete/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del comentario
        schema:
          type: integer
          minimum: 1
    delete:
      tags: [Comments]
      summary: Eliminar un comentario
      responses:
        '200':
          description: Comentario eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/update/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del comentario
        schema:
          type: integer
          minimum: 1
    put:
      tags: [Comments]
      summary: Actualizar el texto de un comentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comentario]
              properties:
                comentario:
                  type: string
                  example: "Comentario editado"
      responses:
        '200':
          description: Comentario actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/updateVisibility:
    patch:
      tags: [Comments]
      summary: Recalcular visibilidad de comentarios por antigüedad (en meses)
      description: |
        Marca como `visible:false` los comentarios con antigüedad mayor o igual al valor `mes`.
        Si no se envía `mes` en el body, se usa la variable de entorno `MESES_VISIBILIDAD` (default 6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mes]
              properties:
                mes:
                  type: integer
                  minimum: 1
                  example: 6
      responses:
        '200':
          description: Visibilidad recalculada
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # TAGS
  # ============================================================
  /tags:
    get:
      tags: [Tags]
      summary: Listar todos los tags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags: [Tags]
      summary: Crear un tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
            examples:
              ejemplo:
                value:
                  nombre: "humor"
      responses:
        '201':
          description: Tag creado
        '400':
          $ref: '#/components/responses/BadRequest'

  /tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del tag
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Tags]
      summary: Obtener un tag por ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tags]
      summary: Actualizar un tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '200':
          description: Tag actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tags]
      summary: Eliminar un tag
      responses:
        '200':
          description: Tag eliminado
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================================
# COMPONENTS
# ============================================================
components:

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: ID del usuario
      schema:
        type: integer
        minimum: 1
    PostId:
      name: id_post
      in: path
      required: true
      description: ID del post
      schema:
        type: integer
        minimum: 1
    PostImageId:
      name: id_pi
      in: path
      required: true
      description: ID de la imagen del post
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: "cris"
    UserInput:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          maxLength: 20
          example: "cris"

    Post:
      type: object
      properties:
        id:
          type: integer
        texto:
          type: string
        id_user:
          type: integer
        fechaPublicacion:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/PostImage'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    PostImage:
      type: object
      properties:
        id:
          type: integer
        url_image:
          type: string
          example: "/media/1716580000000-foto.jpg"
        id_post:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: integer
        comentario:
          type: string
        fecha_publicacion:
          type: string
          format: date-time
        visible:
          type: boolean
        antiguedadMes:
          type: integer
          description: Campo virtual — meses desde la publicación
        id_user:
          type: integer
        id_post:
          type: integer

    Tag:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
          example: "humor"
    TagInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 20
          example: "humor"

    Error:
      type: object
      properties:
        message:
          type: string
